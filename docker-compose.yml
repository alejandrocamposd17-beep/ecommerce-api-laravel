services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      APP_KEY: ${APP_KEY:-}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ecommerce_api
      DB_USERNAME: ecommerce
      DB_PASSWORD: ${DB_PASSWORD:-ecommerce_local}
      CACHE_STORE: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: database
      MAIL_MAILER: log
      L5_SWAGGER_CONST_HOST: http://localhost:8000
      STRIPE_KEY: ${STRIPE_KEY:-}
      STRIPE_SECRET: ${STRIPE_SECRET:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    depends_on:
      db:
        condition: service_healthy

  # Ejecuta las tareas programadas (expiración de órdenes pendientes)
  scheduler:
    build: .
    command: ["php", "artisan", "schedule:work"]
    environment:
      RUN_MIGRATIONS: "false"
      APP_ENV: local
      APP_KEY: ${APP_KEY:-}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ecommerce_api
      DB_USERNAME: ecommerce
      DB_PASSWORD: ${DB_PASSWORD:-ecommerce_local}
      CACHE_STORE: file
      STRIPE_SECRET: ${STRIPE_SECRET:-}
    depends_on:
      app:
        condition: service_started

  # Procesa la cola (correos de órdenes, pagos y reembolsos)
  queue:
    build: .
    command: ["php", "artisan", "queue:work", "--tries=3", "--backoff=10"]
    environment:
      RUN_MIGRATIONS: "false"
      APP_ENV: local
      APP_URL: http://localhost:8000
      APP_KEY: ${APP_KEY:-}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ecommerce_api
      DB_USERNAME: ecommerce
      DB_PASSWORD: ${DB_PASSWORD:-ecommerce_local}
      CACHE_STORE: file
      QUEUE_CONNECTION: database
      MAIL_MAILER: log
    depends_on:
      app:
        condition: service_started

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ecommerce_api
      MYSQL_USER: ecommerce
      MYSQL_PASSWORD: ${DB_PASSWORD:-ecommerce_local}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "ecommerce", "-p${DB_PASSWORD:-ecommerce_local}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  db-data:
