name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite, sqlite3, bcmath, curl
          coverage: none

      - name: Validar composer.json
        run: composer validate --no-check-publish

      - name: Instalar dependencias
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Preparar entorno
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Tests (PHPUnit)
        run: php artisan test

      - name: Generar documentación Swagger (valida las anotaciones OpenAPI)
        run: php artisan l5-swagger:generate

      - name: Auditoría de dependencias (vulnerabilidades conocidas)
        run: composer audit
        continue-on-error: true

  docker:
    name: Build de la imagen Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir imagen
        run: docker build -t ecommerce-api:ci .
