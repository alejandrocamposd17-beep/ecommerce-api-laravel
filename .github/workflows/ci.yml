name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests y cobertura (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite, sqlite3, bcmath, curl
          coverage: pcov

      - name: Validar composer.json
        run: composer validate --no-check-publish

      - name: Instalar dependencias
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Preparar entorno
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Tests con cobertura (mínimo 80%)
        run: php artisan test --coverage --min=80

      - name: Generar documentación Swagger (valida las anotaciones OpenAPI)
        run: php artisan l5-swagger:generate

      - name: Auditoría de dependencias (vulnerabilidades conocidas)
        run: composer audit
        continue-on-error: true

  quality:
    name: Calidad de código (Pint + Larastan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, bcmath, curl
          coverage: none

      - name: Instalar dependencias
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Estilo de código (Laravel Pint)
        run: |
          vendor/bin/pint
          git diff --exit-code

      - name: Instalar Larastan
        run: composer require --dev larastan/larastan:^3.0 --no-interaction --no-progress --no-scripts

      - name: Análisis estático (Larastan nivel 5)
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress --error-format=github

  docker:
    name: Build de la imagen Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir imagen
        run: docker build -t ecommerce-api:ci .
